# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: true
default_install_hook_types: [commit-msg, pre-commit, pre-push]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.6.0
  hooks:
  - id: check-case-conflict
    stages: ["pre-commit"]
  - id: check-merge-conflict
    stages: ["pre-commit"]
  - id: check-added-large-files
    stages: ["pre-commit"]
    args: ['--maxkb=5000']
  - id: check-ast
    stages: ["pre-commit"]
  - id: check-executables-have-shebangs
    stages: ["pre-commit"]
  - id: check-symlinks
    stages: ["pre-commit"]
  - id: check-toml
    stages: ["pre-commit"]
  - id: check-yaml
    stages: ["pre-commit"]
  - id: debug-statements
    stages: ["pre-commit"]
  - id: end-of-file-fixer
    stages: ["pre-commit"]
  - id: trailing-whitespace
    stages: ["pre-commit"]

- repo: local
  hooks:
  - id: uv-lock
    name: uv-lock
    entry: uv lock --check
    language: system
    pass_filenames: false
    files: ^(.*/)?(uv\.lock|pyproject\.toml)$
    stages: ["pre-commit"]

  - id: ruff-format
    name: ruff-format
    entry: uv run ruff format
    language: system
    files: \.py$
    stages: ["pre-commit"]

  - id: ruff
    name: ruff
    entry: uv run ruff check aioauth_client
    language: system
    pass_filenames: false
    files: \.py$
    stages: ["pre-commit"]

  - id: mypy
    name: mypy
    entry: uv run mypy
    language: system
    pass_filenames: false
    files: \.py$
    stages: ["pre-push"]

  - id: pytest
    name: pytest
    entry: uv run pytest
    language: system
    pass_filenames: false
    files: \.py$
    stages: ["pre-push"]
