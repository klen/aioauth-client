[project]
name = "aioauth-client"
version = "0.30.1"
description = "OAuth support for Asyncio/Trio libraries"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kirill Klenov", email = "horneds@gmail.com" }]
keywords = ["asyncio", "trio", "oauth"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.11"
dependencies = ["httpx"]

[project.urls]
Homepage = "https://github.com/klen/aioauth-client"
Repository = "https://github.com/klen/aioauth-client"

[dependency-groups]
dev = [
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-aio",
  "pytest-mypy",
  "ruff",
  "trio",
]
example = ["asgi-sessions", "asgi-tools", "uvicorn"]

[tool.pytest.ini_options]
addopts = "-svx --mypy"

[tool.mypy]
packages = ["aioauth_client"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "docs", "example"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "A003",
  "ANN",
  "COM812",
  "CPY001",
  "D",
  "DJ",
  "EM",
  "N804",
  "PLR0912",
  "PLR0917",
  "PLR2004",
  "RET",
  "RSE",
  "RUF023",
  "S101",
  "SLF",
  "TC006",
  "TRY003",
  "UP",
]

[tool.ruff.lint.per-file-ignores]
# Endpoint URLs and token field names, not credentials.
"aioauth_client/base.py" = ["S105"]
"aioauth_client/oauth1.py" = ["S105"]
"aioauth_client/clients/*.py" = ["S105"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
