version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - autosquash
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"

  # Maintain dependencies for Python
  - package-ecosystem: "uv"
    directory: "/"
    labels:
      - dependencies
      - autosquash
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
