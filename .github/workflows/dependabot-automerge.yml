name: dependabot-automerge

on:
  pull_request:
    branches: [develop]

permissions:
  actions: read
  contents: write
  pull-requests: write
  vulnerability-alerts: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'develop' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Read Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v3
      with:
        github-token: ${{ github.token }}

    # Merge patch/minor updates, and major updates for packages with an open
    # Dependabot alert, once the tests workflow for the PR head has passed.
    - name: Wait for CI and merge
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha }}
        PR: ${{ github.event.pull_request.number }}
        UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        DEPS: ${{ steps.metadata.outputs.dependency-names }}
      run: |
        set -euo pipefail

        major=false
        case "$UPDATE_TYPE" in *semver-major*) major=true ;; esac

        security=false
        if [ "$major" = true ]; then
          alerts=$(gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" 2>/dev/null || true)
          if [ -z "$alerts" ]; then
            echo "::warning::Dependabot alerts are not readable, major updates are not auto-merged"
          else
            for name in ${DEPS//,/ }; do
              if jq -e --arg n "$name" 'any(.[]; .dependency.package.name == $n)' <<<"$alerts" >/dev/null; then
                security=true
                break
              fi
            done
          fi
        fi

        if [ "$major" = true ] && [ "$security" = false ]; then
          echo "major update without an open security alert: leaving it for a human"
          exit 0
        fi

        run_id=""
        for _ in $(seq 1 60); do
          run_id=$(gh api \
            "repos/$REPO/actions/workflows/tests.yml/runs?head_sha=$SHA&event=pull_request" \
            --jq '.workflow_runs[0].id // empty')
          if [ -n "$run_id" ]; then break; fi
          sleep 10
        done
        if [ -z "$run_id" ]; then
          echo "::error::tests workflow for $SHA not found"
          exit 1
        fi
        gh run watch "$run_id" --exit-status --interval 10
        gh pr merge "$PR" --squash --delete-branch
